<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda UPB - Iniciar sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <h1>Tienda UPB · Punto de venta</h1>
    <form id="form-login">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" required autocomplete="username">

      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit">Ingresar</button>
    </form>
    <p id="error" class="error oculto"></p>
    <p class="ayuda">Usuario de prueba: cajero1 / 1234</p>
  </div>

  <script src="login.js"></script>
</body>
</html>
